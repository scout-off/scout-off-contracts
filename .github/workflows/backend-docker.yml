name: Backend Docker build
on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "package*.json"
      - "Dockerfile.backend"
      - ".dockerignore"
      - "tsconfig*.json"
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
