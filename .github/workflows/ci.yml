# Fast, dependency-free static checks; see contract-ci.yml for the full
# build, test, lint, bindings, and sandbox pipeline kept separate from this gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block TODO/FIXME/HACK markers in contract source
        run: |
          # The pattern uses grouping `(...)` and alternation `|`, which are
          # extended-regex constructs. grep treats them as literal characters
          # in basic mode, so without `-E` this gate would silently never match
          # a TODO/FIXME/HACK/XXX marker and let them merge to main undetected.
          if grep -rInE '\b(TODO|FIXME|HACK|XXX)\b' contracts/ --include='*.rs'; then
            echo "ERROR: TODO/FIXME/HACK/XXX markers found in contract source."
            echo "Resolve them or remove them before merging."
            exit 1
          fi
          echo "No TODO/FIXME/HACK/XXX markers found."
      - name: Check database migration numbering
        run: bash scripts/check-migration-numbering.sh

  check-node-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check Node scripts
        run: |
          # `node --check` alone cannot catch structural breakage such as
          # functions accidentally nested inside another function (issue #1648),
          # so the Jest smoke test below exercises main() at runtime.
          for f in scripts/*.js; do
            node --check "$f"
          done
      - name: Run reconcile-indexer smoke test
        run: npx --yes jest scripts/reconcile-indexer.test.js
