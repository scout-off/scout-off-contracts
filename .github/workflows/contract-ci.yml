name: Soroban Contract CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Test progress contract
        run: cargo test -p scoutchain-progress -- --nocapture

      - name: Verify test snapshots are current
        run: git diff --exit-code -- contracts/*/test_snapshots

      - name: Build WASM (release)
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Record WASM sizes
        run: |
          mkdir -p target/wasm-size-report
          {
            for f in target/wasm32v1-none/release/*.wasm; do
              size=$(wc -c < "$f")
              echo "$f: $size bytes"
              [ "$size" -lt 65536 ] || {
                echo "WASM too large: $f"
                exit 1
              }
            done
          } | tee target/wasm-size-report/wasm-sizes.txt

      - name: Upload WASM size report
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: target/wasm-size-report/wasm-sizes.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Docs completeness check
        run: bash scripts/check-docs.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
