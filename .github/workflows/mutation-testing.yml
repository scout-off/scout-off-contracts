# Mutation testing workflow for scout-off-contracts
# Runs cargo-mutants on highest-risk payment/escrow code and shared helpers
name: Mutation Testing

on:
  # Weekly schedule (Sundays at midnight UTC)
  schedule:
    - cron: '0 0 * * 0'
  # Manual trigger for ad-hoc runs
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  mutation-test:
    name: Mutation Testing (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Pin ed25519-dalek to fix soroban-env-host trait bound error
        run: cargo update -p ed25519-dalek@3.0.0 --precise 3.0.0-rc.0 || true

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run workspace tests (prerequisite for mutation testing)
        run: cargo test --workspace --locked

      - name: Run mutation testing (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          cargo mutants --config mutants.toml --in-place --shard ${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload mutation testing results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-out-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  # Aggregate results and check against baseline
  check-baseline:
    name: Check Baseline
    runs-on: ubuntu-latest
    needs: mutation-test
    if: always()

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all shard results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e00573a4be5a8f4a75 # v4.6.2
        with:
          pattern: mutants-out-shard-*
          path: mutants-out/
          merge-multiple: true

      - name: Combine shard results
        run: |
          # Combine all shard outputs into a single directory
          find mutants-out/ -name "*.json" -type f | wc -l

      - name: Upload combined mutation testing report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-out-combined
          path: mutants.out/
          if-no-files-found: warn

      - name: Check missed mutant count against baseline
        run: |
          # Parse the mutation testing results and count missed mutants
          # This script should be updated once we have the actual baseline
          echo "Checking missed mutant count against baseline..."
          echo "Baseline: TBD (update after initial run)"
          echo "Current: TBD (parse from mutants.out/)"
          
          # For now, this step is informational
          # Once baseline is established, add:
          # if [ $CURRENT_MISSED -gt $BASELINE_MISSED ]; then
          #   echo "Error: Missed mutant count ($CURRENT_MISSED) exceeds baseline ($BASELINE_MISSED)"
          #   exit 1
          # fi
