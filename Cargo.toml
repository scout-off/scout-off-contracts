[workspace]
members = [
    "contracts/shared-types",
    "contracts/registration",
    "contracts/verification",
    "contracts/progress",
    "contracts/scout_access",
    "contracts/chaos-tests",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = "25.3.1"
ed25519-dalek = "=3.0.0-rc.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
# Pin hashbrown to the v0.14.5 source known to compile for Soroban SDK 25.x
# WASM builds; this override was introduced with validator vector tracking.
hashbrown = { git = 'https://github.com/rust-lang/hashbrown.git', tag = 'v0.14.5' }
