version: "3.9"

# ScoutChain local development stack.
# Start with:  scripts/dev-up.sh
# Tear down:   scripts/dev-down.sh
#
# Services:
#   stellar   – Stellar/Soroban local sandbox (quickstart --local)
#   postgres  – PostgreSQL 15 for the backend
#   backend   – ScoutChain HTTP backend (built from Dockerfile)

services:
  # ── Stellar/Soroban local sandbox ──────────────────────────────────────────
  stellar:
    # Pinned to the same digest used by the CI bindings-smoke-test job.
    image: stellar/quickstart:testing@sha256:66a19476f2ce2ed09c4dccf3f1af4d438209eee9ee05eb113a02dd926e2b03f5
    command: ["--local", "--limits", "unlimited"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - |
          curl -sf http://localhost:8000/soroban/rpc \
            -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}' \
            | grep -q '"sequence"'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── PostgreSQL 15 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: scoutchain
      POSTGRES_PASSWORD: scoutchain
      POSTGRES_DB: scoutchain_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutchain -d scoutchain_dev"]
      interval: 3s
      timeout: 5s
      retries: 15

  # ── ScoutChain backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local          # written by scripts/dev-up.sh
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
