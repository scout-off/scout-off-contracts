# Mutation testing configuration for scout-off-contracts
# Scopes mutation testing to highest-risk payment/escrow code and shared helpers

# Limit to specific crates
[package]
# Only test scout_access (payment/escrow functions) and shared-types (safe-math, validation)
# Exclude other contracts to keep runtime manageable
workspace_members = [
    "scoutchain-scout-access",
    "scoutchain-shared-types",
]

# Exclude generated code and event helpers
[exclude]
# Exclude event helpers (generated event emitters)
files = [
    "contracts/scout_access/src/events.rs",
]

# Exclude generated client stubs (cross-concall clients generated by #[contractclient])
# These are in the progress_contract and registration_contract modules within lib.rs
patterns = [
    # The progress_contract and registration_contract modules contain generated client stubs
    "progress_contract",
    "registration_contract",
]

# Additional exclusions for functions that are pure event emitters or test-only
[functions]
# Exclude functions that only emit events without business logic
exclude = [
    # Event emission functions in events.rs (already excluded by file pattern)
    # Test-only functions
    "testutils",
]

# Mutation operators to apply
[mutators]
# Default mutators are appropriate for this codebase
# cargo-mutants will apply: arithmetic, boolean, bitwise, comparison, etc.
